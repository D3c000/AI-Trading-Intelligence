name: Trading Simulator

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: simulator
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python trader.py
      - run: |
          git config user.name 'Trading Simulator'
          git config user.email 'simulator@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'Update simulated portfolio'
          git push
